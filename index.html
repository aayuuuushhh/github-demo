<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>School Admission Form</title>

    <style>
      :root {
        --primary: #164e63;
        --primary-dark: #0f3442;
        --accent: #f59e0b;
        --background: #eef6f8;
        --surface: #ffffff;
        --text: #1f2937;
        --muted: #64748b;
        --border: #d7e2e7;
        --success: #15803d;
        --error: #dc2626;
        --radius: 16px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        padding: 32px 16px;
        background:
          radial-gradient(
            circle at top left,
            rgba(245, 158, 11, 0.18),
            transparent 30%
          ),
          linear-gradient(135deg, #e8f4f7, #f8fafc);
        color: var(--text);
        font-family: Georgia, "Times New Roman", serif;
      }

      .page-wrapper {
        max-width: 1080px;
        margin: 0 auto;
      }

      .form-header {
        padding: 34px;
        border-radius: var(--radius) var(--radius) 0 0;
        color: white;
        background: linear-gradient(
          135deg,
          var(--primary-dark),
          var(--primary)
        );
        box-shadow: 0 18px 40px rgba(15, 52, 66, 0.16);
      }

      .form-header h1 {
        margin-bottom: 8px;
        font-size: clamp(2rem, 5vw, 3rem);
        letter-spacing: -1px;
      }

      .form-header p {
        max-width: 700px;
        color: #d5e7eb;
        font-family: Arial, sans-serif;
        line-height: 1.6;
      }

      .admission-form {
        padding: clamp(20px, 4vw, 42px);
        border-radius: 0 0 var(--radius) var(--radius);
        background: var(--surface);
        box-shadow: 0 18px 40px rgba(15, 52, 66, 0.12);
      }

      .form-section {
        margin-bottom: 38px;
      }

      .section-heading {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 22px;
        padding-bottom: 12px;
        border-bottom: 2px solid #e9f0f2;
      }

      .section-number {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border-radius: 50%;
        color: white;
        background: var(--accent);
        font-family: Arial, sans-serif;
        font-weight: bold;
      }

      .section-heading h2 {
        color: var(--primary-dark);
        font-size: 1.35rem;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .full-width {
        grid-column: 1 / -1;
      }

      label {
        color: var(--primary-dark);
        font-family: Arial, sans-serif;
        font-size: 0.9rem;
        font-weight: 700;
      }

      label span {
        color: var(--error);
      }

      input,
      select,
      textarea {
        width: 100%;
        padding: 13px 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
        outline: none;
        color: var(--text);
        background: #fbfdfe;
        font:
          0.95rem Arial,
          sans-serif;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }

      textarea {
        min-height: 110px;
        resize: vertical;
      }

      input:focus,
      select:focus,
      textarea:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(22, 78, 99, 0.12);
      }

      .radio-group,
      .checkbox-group {
        display: flex;
        flex-wrap: wrap;
        gap: 14px 24px;
        padding-top: 5px;
      }

      .radio-option,
      .checkbox-option {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--text);
        font-family: Arial, sans-serif;
        font-weight: normal;
      }

      .radio-option input,
      .checkbox-option input {
        width: auto;
        accent-color: var(--primary);
      }

      .file-note {
        color: var(--muted);
        font:
          0.8rem Arial,
          sans-serif;
      }

      .form-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-top: 12px;
        padding-top: 24px;
        border-top: 1px solid var(--border);
      }

      .required-note {
        color: var(--muted);
        font:
          0.85rem Arial,
          sans-serif;
      }

      button {
        border: 0;
        border-radius: 10px;
        padding: 14px 26px;
        color: white;
        background: var(--primary);
        cursor: pointer;
        font:
          700 0.95rem Arial,
          sans-serif;
        transition:
          background 0.2s,
          transform 0.2s;
      }

      button:hover {
        background: var(--primary-dark);
        transform: translateY(-1px);
      }

      .message {
        display: none;
        margin-bottom: 24px;
        padding: 14px 16px;
        border-radius: 10px;
        font:
          0.95rem Arial,
          sans-serif;
      }

      .message.success {
        display: block;
        color: var(--success);
        background: #dcfce7;
      }

      .message.error {
        display: block;
        color: var(--error);
        background: #fee2e2;
      }

      @media (max-width: 700px) {
        body {
          padding: 16px 10px;
        }

        .form-header {
          padding: 26px 20px;
        }

        .admission-form {
          padding: 24px 18px;
        }

        .form-grid {
          grid-template-columns: 1fr;
          gap: 16px;
        }

        .full-width {
          grid-column: auto;
        }

        .form-actions {
          align-items: stretch;
          flex-direction: column;
        }

        button {
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <main class="page-wrapper">
      <header class="form-header">
        <h1>School Admission Form</h1>
        <p>
          Complete the form below to apply for admission. Fields marked with
          <strong>*</strong> are required.
        </p>
      </header>

      <form class="admission-form" id="admissionForm" novalidate>
        <div id="formMessage" class="message" role="alert"></div>

        <section class="form-section">
          <div class="section-heading">
            <div class="section-number">1</div>
            <h2>Student Information</h2>
          </div>

          <div class="form-grid">
            <div class="form-group">
              <label for="firstName">First Name <span>*</span></label>
              <input id="firstName" name="firstName" type="text" required />
            </div>

            <div class="form-group">
              <label for="lastName">Last Name <span>*</span></label>
              <input id="lastName" name="lastName" type="text" required />
            </div>

            <div class="form-group">
              <label for="dateOfBirth">Date of Birth <span>*</span></label>
              <input id="dateOfBirth" name="dateOfBirth" type="date" required />
            </div>

            <div class="form-group">
              <label>Gender <span>*</span></label>
              <div class="radio-group">
                <label class="radio-option">
                  <input type="radio" name="gender" value="Female" required />
                  Female
                </label>
                <label class="radio-option">
                  <input type="radio" name="gender" value="Male" />
                  Male
                </label>
                <label class="radio-option">
                  <input type="radio" name="gender" value="Other" />
                  Other
                </label>
              </div>
            </div>

            <div class="form-group">
              <label for="grade">Grade Applying For <span>*</span></label>
              <select id="grade" name="grade" required>
                <option value="">Select grade</option>
                <option>Kindergarten</option>
                <option>Grade 1</option>
                <option>Grade 2</option>
                <option>Grade 3</option>
                <option>Grade 4</option>
                <option>Grade 5</option>
                <option>Grade 6</option>
                <option>Grade 7</option>
                <option>Grade 8</option>
                <option>Grade 9</option>
                <option>Grade 10</option>
                <option>Grade 11</option>
                <option>Grade 12</option>
              </select>
            </div>

            <div class="form-group">
              <label for="previousSchool">Previous School</label>
              <input id="previousSchool" name="previousSchool" type="text" />
            </div>
          </div>
        </section>

        <section class="form-section">
          <div class="section-heading">
            <div class="section-number">2</div>
            <h2>Parent or Guardian Information</h2>
          </div>

          <div class="form-grid">
            <div class="form-group">
              <label for="guardianName">Full Name <span>*</span></label>
              <input
                id="guardianName"
                name="guardianName"
                type="text"
                required
              />
            </div>

            <div class="form-group">
              <label for="relationship">Relationship <span>*</span></label>
              <select id="relationship" name="relationship" required>
                <option value="">Select relationship</option>
                <option>Parent</option>
                <option>Guardian</option>
                <option>Grandparent</option>
                <option>Other</option>
              </select>
            </div>

            <div class="form-group">
              <label for="email">Email Address <span>*</span></label>
              <input id="email" name="email" type="email" required />
            </div>

            <div class="form-group">
              <label for="phone">Phone Number <span>*</span></label>
              <input id="phone" name="phone" type="tel" required />
            </div>

            <div class="form-group full-width">
              <label for="address">Home Address <span>*</span></label>
              <textarea id="address" name="address" required></textarea>
            </div>
          </div>
        </section>

        <section class="form-section">
          <div class="section-heading">
            <div class="section-number">3</div>
            <h2>Additional Details</h2>
          </div>

          <div class="form-grid">
            <div class="form-group">
              <label for="emergencyContact"
                >Emergency Contact Name <span>*</span></label
              >
              <input
                id="emergencyContact"
                name="emergencyContact"
                type="text"
                required
              />
            </div>

            <div class="form-group">
              <label for="emergencyPhone"
                >Emergency Contact Phone <span>*</span></label
              >
              <input
                id="emergencyPhone"
                name="emergencyPhone"
                type="tel"
                required
              />
            </div>

            <div class="form-group full-width">
              <label for="medicalInfo">Medical Conditions or Allergies</label>
              <textarea
                id="medicalInfo"
                name="medicalInfo"
                placeholder="Enter any relevant medical information"
              ></textarea>
            </div>

            <div class="form-group full-width">
              <label for="documents">Upload Supporting Documents</label>
              <input
                id="documents"
                name="documents"
                type="file"
                accept=".pdf,.jpg,.jpeg,.png"
                multiple
              />
              <small class="file-note">
                Accepted formats: PDF, JPG, JPEG, PNG
              </small>
            </div>

            <div class="form-group full-width">
              <label class="checkbox-option">
                <input type="checkbox" name="agreement" required />
                I confirm that the information provided is accurate.
                <span>*</span>
              </label>
            </div>
          </div>
        </section>

        <div class="form-actions">
          <p class="required-note">* Required fields</p>
          <button type="submit">Submit Application</button>
        </div>
      </form>
    </main>

    <script>
      const form = document.getElementById("admissionForm");
      const message = document.getElementById("formMessage");

      form.addEventListener("submit", function (event) {
        event.preventDefault();

        if (!form.checkValidity()) {
          message.className = "message error";
          message.textContent = "Please complete all required fields.";
          form.reportValidity();
          return;
        }

        const formData = new FormData(form);
        const application = Object.fromEntries(formData.entries());

        console.log("Admission application:", application);

        message.className = "message success";
        message.textContent =
          "Your admission application has been submitted successfully.";

        form.reset();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    </script>
  </body>
</html>
